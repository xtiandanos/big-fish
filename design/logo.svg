<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sea" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0e5a8e"/>
      <stop offset="60%" stop-color="#073d66"/>
      <stop offset="100%" stop-color="#03253f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f2762e"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="55%" stop-color="#e65096"/>
      <stop offset="100%" stop-color="#8c46c8"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a56"/>
      <stop offset="100%" stop-color="#e8681f"/>
    </linearGradient>
  </defs>

  <!-- ocean background -->
  <rect width="1024" height="1024" fill="url(#sea)"/>

  <!-- light rays -->
  <g fill="#bfe9ff" opacity="0.08">
    <polygon points="240,0 330,0 540,1024 340,1024"/>
    <polygon points="600,0 690,0 880,1024 700,1024"/>
  </g>

  <!-- bubbles -->
  <g fill="#ffffff">
    <circle cx="288" cy="296" r="24" opacity="0.32"/>
    <circle cx="352" cy="224" r="14" opacity="0.28"/>
    <circle cx="240" cy="388" r="10" opacity="0.24"/>
    <circle cx="782" cy="716" r="18" opacity="0.26"/>
    <circle cx="820" cy="640" r="10" opacity="0.22"/>
  </g>

  <!-- caudal fan tail (guppy signature) -->
  <path d="M 432 512
           C 356 434, 292 366, 238 312
           C 276 452, 276 572, 238 712
           C 292 658, 356 590, 432 512 Z"
        fill="url(#tail)"/>

  <!-- dorsal fin -->
  <path d="M 488 440 Q 580 300 716 430 Q 620 400 488 440 Z" fill="url(#fin)"/>

  <!-- body -->
  <ellipse cx="566" cy="512" rx="188" ry="110" fill="url(#body)"/>

  <!-- belly highlight -->
  <ellipse cx="586" cy="566" rx="128" ry="48" fill="#ffd9a8" opacity="0.45"/>

  <!-- side stripe -->
  <path d="M 430 470 Q 560 430 720 470" stroke="#ffdf9e" stroke-width="16"
        fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="700" cy="478" r="26" fill="#101820"/>
  <circle cx="709" cy="469" r="9" fill="#ffffff"/>

  <!-- mouth -->
  <path d="M 748 540 Q 730 552 708 548" stroke="#a54816" stroke-width="10"
        fill="none" stroke-linecap="round"/>

  <!-- pectoral fin -->
  <path d="M 600 596 Q 660 640 716 636 Q 668 600 636 572 Q 612 580 600 596 Z"
        fill="url(#fin)" opacity="0.95"/>
</svg>
